<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdrianString Unified Engine</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #111;
            --border: #222;
            --accent: #00ff41;
            --danger: #ff003c;
            --text: #ddd;
            --mono: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            margin: 0;
            padding: 15px;
            line-height: 1.4;
        }
        h1 { color: var(--accent); text-align: center; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 5px var(--accent); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; background: var(--panel); border: 1px solid var(--border); color: var(--accent); font-family: var(--mono); outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; font-weight: bold; font-family: var(--mono); cursor: pointer; text-transform: uppercase; }
        button:disabled { background: #333; color: #555; }
        .module { background: var(--panel); border: 1px solid var(--border); margin-bottom: 15px; padding: 15px; border-left: 3px solid var(--accent); }
        .module h2 { margin-top: 0; font-size: 1rem; color: var(--accent); border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
        .result-item { font-size: 0.85rem; margin-bottom: 5px; word-break: break-all; }
        .danger-text { color: var(--danger); font-weight: bold; }
        .loader { color: var(--accent); font-size: 0.9rem; margin-bottom: 15px; display: none; }
        .badge { background: #222; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; margin-right: 5px; border: 1px solid #444; }
        
        /* Modul AI */
        #ai-module { border-left: 3px solid #00bfff; display: none; }
        #ai-module h2 { color: #00bfff; border-bottom: 1px dashed #00bfff; }
        #ai-response { font-family: sans-serif; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; color: #eee; }
        .ai-code { background: #000; padding: 10px; border: 1px solid #444; font-family: var(--mono); font-size: 0.85rem; overflow-x: auto; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <h1>[ ADRIANSTRING UNIFIED ENGINE ]</h1>
    
    <div class="input-group">
        <input type="text" id="domain" placeholder="target.com" onkeypress="if(event.key==='Enter') runRecon()">
        <button id="scanBtn" onclick="runRecon()">EXECUTE</button>
    </div>

    <div id="loader" class="loader">> Memindai target & menyusun data...</div>
    
    <div id="output">
        <div class="module" id="ai-module">
            <h2>[ AI ANALYSIS - ADRIANSTRING ]</h2>
            <div id="ai-response">Menunggu data recon...</div>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const loader = document.getElementById('loader');
        const scanBtn = document.getElementById('scanBtn');
        const aiModule = document.getElementById('ai-module');
        const aiResponse = document.getElementById('ai-response');

        let reconData = { domain: '', dns: [], subdomains: [], shodan: {} };

        async function runRecon() {
            let domain = document.getElementById('domain').value.trim().toLowerCase();
            domain = domain.replace(/^https?:\/\//, '').split('/')[0];
            if (!domain) return alert("Masukkan domain dulu!");

            document.querySelectorAll('.module:not(#ai-module)').forEach(el => el.remove());
            aiModule.style.display = 'none';
            aiResponse.innerText = "Menunggu data...";
            reconData = { domain: domain, dns: [], subdomains: [], shodan: {} };

            loader.style.display = 'block';
            scanBtn.disabled = true;

            await fetchDNS(domain);
            await fetchSubdomains(domain);
            await fetchIPAndVulns(domain);

            loader.style.display = 'none';
            analyzeWithAI();
        }

        async function fetchDNS(domain) {
            createModule('DNS Records');
            const types = ['A', 'MX', 'TXT', 'NS'];
            for (let type of types) {
                try {
                    let res = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=${type}`, {
                        headers: { 'Accept': 'application/dns-json' }
                    });
                    let data = await res.json();
                    if (data.Answer) {
                        data.Answer.forEach(ans => {
                            reconData.dns.push(`${type}: ${ans.data}`);
                            appendToModule('DNS Records', `<div class="result-item"><span class="badge">${type}</span> ${ans.data}</div>`);
                        });
                    }
                } catch (e) {}
            }
        }

        async function fetchSubdomains(domain) {
            createModule('Subdomain Enumeration (crt.sh)');
            try {
                let res = await fetch(`https://crt.sh/?q=%25.${domain}&output=json`);
                if (!res.ok) throw new Error("Limit");
                let data = await res.json();
                
                let subdomains = new Set();
                data.forEach(item => {
                    item.name_value.split('\n').forEach(sub => {
                        if (sub.endsWith(domain)) subdomains.add(sub.trim());
                    });
                });

                let sorted = Array.from(subdomains).sort();
                reconData.subdomains = sorted;

                if (sorted.length === 0) {
                    appendToModule('Subdomain Enumeration (crt.sh)', `<div class="result-item">Tidak ada subdomain publik.</div>`);
                } else {
                    appendToModule('Subdomain Enumeration (crt.sh)', `<div class="result-item">Ditemukan ${sorted.length} subdomain unik.</div>`);
                    sorted.forEach(sub => {
                        appendToModule('Subdomain Enumeration (crt.sh)', `<div class="result-item">> ${sub}</div>`);
                    });
                }
            } catch (e) {
                appendToModule('Subdomain Enumeration (crt.sh)', `<div class="result-item danger-text">Gagal menarik data subdomain.</div>`);
            }
        }

        async function fetchIPAndVulns(domain) {
            createModule('IP & Vulnerability Intel');
            try {
                let dnsRes = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {
                    headers: { 'Accept': 'application/dns-json' }
                });
                let dnsData = await dnsRes.json();
                
                if (!dnsData.Answer) {
                    appendToModule('IP & Vulnerability Intel', `<div class="result-item">Gagal resolve IP.</div>`);
                    return;
                }

                let ip = dnsData.Answer[0].data;
                reconData.shodan.ip = ip;
                appendToModule('IP & Vulnerability Intel', `<div class="result-item">IP Target: <span class="danger-text">${ip}</span></div>`);

                let shodanRes = await fetch(`https://internetdb.shodan.io/${ip}`);
                if (shodanRes.status === 404) {
                    appendToModule('IP & Vulnerability Intel', `<div class="result-item">Shodan tidak punya data scan untuk IP ini.</div>`);
                    return;
                }

                let shodanData = await shodanRes.json();
                reconData.shodan = { ip: ip, ...shodanData };
                
                if (shodanData.ports) {
                    appendToModule('IP & Vulnerability Intel', `<div class="result-item">Port Terbuka: <span class="danger-text">${shodanData.ports.join(', ')}</span></div>`);
                }
                if (shodanData.vulns) {
                    appendToModule('IP & Vulnerability Intel', `<div class="result-item danger-text">CVE: ${shodanData.vulns.join(', ')}</div>`);
                }
                if (shodanData.tags) {
                    appendToModule('IP & Vulnerability Intel', `<div class="result-item">Tags: ${shodanData.tags.join(', ')}</div>`);
                }
            } catch (e) {
                appendToModule('IP & Vulnerability Intel', `<div class="result-item danger-text">Gagal mengambil data Shodan.</div>`);
            }
        }

        // === BAGIAN AI ADRIANSTRING (METODE GET STABIL) ===
        async function analyzeWithAI() {
            aiModule.style.display = 'block';
            aiResponse.innerHTML = '<span style="color:#00bfff">[AI] Menganalisis data recon... Sabar.</span>';
            output.prepend(aiModule);

            const dataStr = JSON.stringify(reconData);
            // Batasi panjang data agar URL GET tidak terlalu panjang
            const truncatedData = dataStr.length > 2000 ? dataStr.substring(0, 2000) + "..." : dataStr;

            const promptText = `Kamu adalah AdrianString, AI Hacker Senior. Analisis recon untuk target ${reconData.domain}. Data: ${truncatedData}. Berikan analisis taktis singkat, temukan celah (subdomain/port/CVE), dan sebutkan 1-2 langkah selanjutnya (Termux/Python) tanpa disclaimer.`;

            try {
                // Menggunakan metode GET ke endpoint text.pollinations.ai
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                let text = await response.text();
                
                // Format blok kode jika ada
                text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                    return `<div class="ai-code">${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
                });
                
                aiResponse.innerHTML = text;

            } catch (error) {
                aiResponse.innerHTML = `<span style="color:var(--danger)">AI Error: ${error.message}. Server AI publik sedang penuh. Coba scan ulang beberapa saat lagi.</span>`;
            }
        }

        function createModule(title) {
            const div = document.createElement('div');
            div.className = 'module';
            div.id = `mod-${title.replace(/[^a-z0-9]/gi, '')}`;
            div.innerHTML = `<h2>${title}</h2><div class="content"></div>`;
            output.appendChild(div);
        }

        function appendToModule(title, html) {
            const mod = document.getElementById(`mod-${title.replace(/[^a-z0-9]/gi, '')}`);
            if (mod) mod.querySelector('.content').innerHTML += html;
        }
    </script>
</body>
</html>
